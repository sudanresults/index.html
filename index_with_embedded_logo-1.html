<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام مدرسة الصداقة</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#4b9bb1,#c7e4ea,#69b3c5);color:#111;padding:20px}
.container{width:100%;max-width:760px;margin:auto}
.card{background:rgba(255,255,255,.96);border:2px solid #79b9ca;border-radius:20px;padding:28px;box-shadow:0 12px 35px rgba(30,80,95,.25)}
.logo{width:150px;height:150px;display:block;object-fit:contain;margin:0 auto 12px}
h1{text-align:center;margin:5px 0;font-size:29px;color:#111}
h2{text-align:center;margin:5px 0 25px;color:#145f79;font-size:21px}
.form-group{margin-bottom:15px}
label{display:block;margin-bottom:7px;color:#145f79;font-weight:bold}
input[type=number]{width:100%;padding:14px;border:2px solid #8bc2d0;border-radius:11px;font-size:18px;text-align:center;outline:none;background:white}
input[type=number]:focus{border-color:#176fc4}
.remember{display:flex;align-items:center;gap:8px;margin:12px 0;color:#333}
.remember input{width:auto}
button{width:100%;height:52px;border:none;border-radius:11px;background:#176fc4;color:white;font-size:17px;font-weight:bold;cursor:pointer}
button:hover{background:#105da8}
.error{display:none;margin-top:12px;color:#b00020;text-align:center;font-weight:bold}
#result{display:none}
.result-title{text-align:center;font-size:25px;font-weight:bold;color:#111;border-bottom:3px solid #5aa4b8;padding-bottom:12px;margin-bottom:20px}
.student-info{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.info-box{background:#fff;border:1px solid #a9d1dc;border-radius:10px;padding:13px;font-size:16px}
.info-label{color:#145f79;font-weight:bold}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}
th{background:#5aa4b8;color:white;padding:13px;font-size:17px}
td{padding:12px;text-align:center;border-bottom:1px solid #d7e5e9;color:#000;font-size:17px}
tr:last-child td{border-bottom:none}
.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.summary-box{background:#fff;border:2px solid #5aa4b8;border-radius:12px;padding:15px;text-align:center;font-size:18px;font-weight:bold}
.summary-number{display:block;margin-top:7px;color:#000;font-size:24px}
.back-button{margin-top:18px;background:#555}
.back-button:hover{background:#333}
.footer{text-align:center;margin-top:20px;color:#666;font-size:13px}
@media(max-width:600px){body{padding:10px}.card{padding:20px 14px}h1{font-size:25px}h2{font-size:19px}.student-info,.summary{grid-template-columns:1fr}th,td{font-size:15px;padding:10px 5px}.logo{width:130px;height:130px}}
</style>
</head>

<h1>نظام مدرسة الصداقة</h1>
<h2 id="pageTitle">امتحانات الشهادة السودانية</h2>

<div id="login">
<div class="form-group">
<label for="seatNumber">رقم الجلوس</label>
<input type="number" id="seatNumber" placeholder="أدخل رقم الجلوس">
</div>

<div class="form-group">
<label for="confirmSeat">أعد رقم الجلوس</label>
<input type="number" id="confirmSeat" placeholder="أعد إدخال رقم الجلوس">
</div>

<label class="remember">
<input type="checkbox" id="remember">
تذكرني
</label>

<button onclick="login()">تسجيل الدخول</button>
<div id="error" class="error">رقم الجلوس غير موجود أو الرقمين غير متطابقين</div>
</div>

<div id="result">
<div class="result-title">نتيجة امتحانات الشهادة السودانية</div>

<div class="student-info">
<div class="info-box"><span class="info-label">رقم الجلوس:</span> <span id="resultSeat"></span></div>
<div class="info-box"><span class="info-label">الاسم:</span> <span id="resultName"></span></div>
<div class="info-box"><span class="info-label">اسم الأم:</span> <span id="resultMother"></span></div>
<div class="info-box"><span class="info-label">المدرسة:</span> <span id="resultSchool"></span></div>
</div>

<table>
<thead><tr><th>المادة</th><th>الدرجة</th></tr></thead>
<tbody id="gradesTable"></tbody>
</table>

<div class="summary">
<div class="summary-box">المجموع<span id="total" class="summary-number"></span>من 700</div>
<div class="summary-box">النسبة<span id="percentage" class="summary-number"></span>%</div>
</div>

<button class="back-button" onclick="backToLogin()">العودة والبحث عن رقم آخر</button>
</div>

<div class="footer">نظام مدرسة الصداقة</div>
</div>
</div>

<script>
const students = {
"186939": {
name:"غسان الطيب عبد الباقي الطيب",
mother:"شاهيناز عيسى",
school:"الصداقة السودانية",
grades:{"القرآن":89,"الحاسوب":90,"الكيمياء":86,"العربي":88,"الرياضيات":61,"الفيزياء":77,"الإنجليزي":90}
},
"202936": {
name:"رنان الطيب عبد الباقي الطيب",
mother:"شاهيناز عيسى",
school:"الصداقة السودانية",
grades:{"القرآن":86,"الأحياء":88,"الكيمياء":67,"العربي":90,"الرياضيات":66,"الفيزياء":70,"الإنجليزي":80}
}
};

function login(){
const seat=document.getElementById("seatNumber").value.trim();
const confirmSeat=document.getElementById("confirmSeat").value.trim();
const error=document.getElementById("error");

if(!seat || !confirmSeat || seat!==confirmSeat){
error.style.display="block";
return;
}

const student=students[seat];

if(!student){
error.style.display="block";
return;
}

error.style.display="none";

document.getElementById("resultSeat").textContent=seat;
document.getElementById("resultName").textContent=student.name;
document.getElementById("resultMother").textContent=student.mother;
document.getElementById("resultSchool").textContent=student.school;

const table=document.getElementById("gradesTable");
table.innerHTML="";
let total=0;

for(const subject in student.grades){
const grade=student.grades[subject];
total+=grade;

const row=document.createElement("tr");
row.innerHTML="<td>"+subject+"</td><td>"+grade+"</td>";
table.appendChild(row);
}

document.getElementById("total").textContent=total;
document.getElementById("percentage").textContent=((total/700)*100).toFixed(2);

document.getElementById("login").style.display="none";
document.getElementById("pageTitle").style.display="none";
document.getElementById("result").style.display="block";
window.scrollTo({top:0,behavior:"smooth"});
}

function backToLogin(){
document.getElementById("result").style.display="none";
document.getElementById("login").style.display="block";
document.getElementById("pageTitle").style.display="block";
document.getElementById("seatNumber").value="";
document.getElementById("confirmSeat").value="";
document.getElementById("error").style.display="none";
}

document.getElementById("confirmSeat").addEventListener("keydown",function(event){
if(event.key==="Enter") login();
});
</script>
</body>
</html>
